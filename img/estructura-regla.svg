<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Estructura de una regla CSS: selector, propiedad y valor</title>
  <rect x="4" y="4" width="992" height="292" rx="22" fill="#C0BAB3"/>

  <text x="50" y="80" font-size="38" font-weight="700" fill="#391214">Estructura y sintaxis</text>
  <text x="50" y="116" font-size="20" fill="#52423D">Así se escribe una regla CSS</text>

  <!-- Leyenda -->
  <g font-size="17" fill="#391214">
    <rect x="50" y="146" width="100" height="36" rx="8" fill="#1F1415"/>
    <text x="100" y="170" text-anchor="middle" font-family="Consolas, monospace" fill="#E9C9A0">h1</text>
    <text x="160" y="170">selector</text>

    <rect x="250" y="146" width="100" height="36" rx="8" fill="#1F1415"/>
    <text x="300" y="170" text-anchor="middle" font-family="Consolas, monospace" fill="#F3EFEA">color</text>
    <text x="360" y="170">propiedad</text>

    <rect x="50" y="200" width="100" height="36" rx="8" fill="#1F1415"/>
    <text x="100" y="224" text-anchor="middle" font-family="Consolas, monospace" fill="#C9A597">#391214</text>
    <text x="160" y="224">valor</text>

    <rect x="250" y="200" width="100" height="36" rx="8" fill="#1F1415"/>
    <text x="300" y="224" text-anchor="middle" font-family="Consolas, monospace" fill="#A49B95">{ ; }</text>
    <text x="360" y="224">llaves y ;</text>
  </g>

  <!-- La regla -->
  <rect x="480" y="40" width="470" height="220" rx="14" fill="#1F1415"/>
  <g font-family="Consolas, monospace" font-size="36">
    <text x="515" y="105"><tspan fill="#E9C9A0">h1</tspan> <tspan fill="#A49B95">{</tspan></text>
    <text x="555" y="163"><tspan fill="#F3EFEA">color</tspan><tspan fill="#A49B95">:</tspan> <tspan fill="#C9A597">#391214</tspan><tspan fill="#A49B95">;</tspan></text>
    <text x="515" y="221" fill="#A49B95">}</text>
  </g>
</svg>
