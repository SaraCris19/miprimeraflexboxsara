<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Un ID gana a una clase</title>
  <rect x="4" y="4" width="392" height="292" rx="18" fill="#C0BAB3"/>
  <text x="200" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#391214">¿Quién gana?</text>

  <!-- Estrella del ganador -->
  <path d="M120 62l7 14 15 2-11 11 3 15-14-7-14 7 3-15-11-11 15-2z" fill="#391214"/>

  <!-- Podio -->
  <rect x="60" y="115" width="120" height="135" rx="8" fill="#391214"/>
  <text x="120" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#F3EFEA">#element</text>
  <text x="120" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#C0BAB3">1,0,0</text>

  <rect x="210" y="175" width="140" height="75" rx="8" fill="#887D77"/>
  <text x="280" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#F3EFEA">.container</text>
  <text x="280" y="235" text-anchor="middle" font-size="20" font-weight="700" fill="#F3EFEA">0,1,0</text>

  <line x1="40" y1="250" x2="360" y2="250" stroke="#52423D" stroke-width="3"/>
  <text x="200" y="280" text-anchor="middle" font-size="16" fill="#52423D">Un ID vence a cualquier nº de clases</text>
</svg>
