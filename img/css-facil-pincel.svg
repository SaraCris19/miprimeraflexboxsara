<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>CSS fácil: el pincel de tu página web</title>
  <rect x="4" y="4" width="292" height="292" rx="18" fill="#C0BAB3"/>
  <text x="150" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#391214">CSS = el pincel</text>

  <!-- Página: mitad sin estilo, mitad pintada -->
  <rect x="40" y="60" width="150" height="190" rx="8" fill="#EDE8E3" stroke="#6D726D" stroke-width="2"/>
  <clipPath id="pintado"><rect x="40" y="60" width="150" height="190" rx="8"/></clipPath>
  <path d="M40 60 L190 60 L190 160 L40 210 Z" fill="#887D77" clip-path="url(#pintado)"/>
  <rect x="55" y="80" width="120" height="16" rx="4" fill="#391214"/>
  <rect x="55" y="108" width="90" height="10" rx="3" fill="#52423D"/>
  <rect x="55" y="126" width="105" height="10" rx="3" fill="#52423D"/>
  <rect x="55" y="190" width="100" height="10" rx="3" fill="#A49B95"/>
  <rect x="55" y="208" width="80" height="10" rx="3" fill="#A49B95"/>
  <rect x="55" y="226" width="95" height="10" rx="3" fill="#A49B95"/>

  <!-- Pincel -->
  <g transform="rotate(35 220 150)">
    <rect x="212" y="40" width="16" height="110" rx="7" fill="#52423D"/>
    <rect x="210" y="146" width="20" height="18" fill="#6D726D"/>
    <path d="M210 164 h20 l-4 34 q-6 10 -12 0 z" fill="#391214"/>
  </g>
  <text x="150" y="280" text-anchor="middle" font-size="14" fill="#52423D">HTML da forma, CSS da estilo</text>
</svg>
