<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>::first-letter y ::first-line en un párrafo</title>
  <rect x="4" y="4" width="392" height="292" rx="18" fill="#C0BAB3"/>
  <text x="200" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#391214">Partes de un párrafo</text>

  <!-- Primera letra grande -->
  <rect x="34" y="66" width="62" height="78" rx="6" fill="none" stroke="#391214" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="65" y="132" text-anchor="middle" font-size="72" font-weight="700" fill="#391214">H</text>

  <!-- Primera línea resaltada -->
  <rect x="104" y="72" width="262" height="30" rx="5" fill="#887D77"/>
  <text x="112" y="94" font-size="19" font-weight="700" fill="#F3EFEA">ABÍA UNA VEZ UNA CAJA</text>

  <!-- Resto del párrafo -->
  <rect x="104" y="114" width="230" height="11" rx="4" fill="#A49B95"/>
  <rect x="36" y="156" width="320" height="11" rx="4" fill="#A49B95"/>
  <rect x="36" y="178" width="290" height="11" rx="4" fill="#A49B95"/>
  <rect x="36" y="200" width="250" height="11" rx="4" fill="#A49B95"/>

  <g font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#391214">
    <text x="36" y="250">::first-letter</text>
    <text x="216" y="250">::first-line</text>
  </g>
  <path d="M65 234v-82" stroke="#391214" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M290 234V106" stroke="#391214" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="200" y="280" text-anchor="middle" font-size="14" fill="#52423D">Partes que no existen en tu HTML</text>
</svg>
