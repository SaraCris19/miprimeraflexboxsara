<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Niveles de especificidad: el selector #menu .item:hover a vale 1, 2, 1</title>
  <rect x="4" y="4" width="992" height="292" rx="22" fill="#C0BAB3"/>

  <text x="50" y="72" font-size="36" font-weight="700" fill="#391214">Niveles de</text>
  <text x="50" y="112" font-size="36" font-weight="700" fill="#391214">especificidad</text>
  <text x="50" y="145" font-size="20" fill="#52423D">¿Qué regla gana cuando dos chocan?</text>

  <rect x="50" y="165" width="420" height="54" rx="10" fill="#1F1415"/>
  <text x="72" y="200" font-family="Consolas, monospace" font-size="24" fill="#C0BAB3">#menu <tspan fill="#A49B95">.item:hover</tspan> a</text>
  <text x="50" y="256" font-size="24" font-weight="700" fill="#391214">= 1 · 2 · 1</text>

  <!-- Marcador A, B, C -->
  <g text-anchor="middle">
    <text x="585" y="58" font-size="20" font-weight="700" fill="#391214">A</text>
    <rect x="520" y="70" width="130" height="180" rx="12" fill="#391214"/>
    <text x="585" y="170" font-size="76" font-weight="700" fill="#F3EFEA">1</text>
    <text x="585" y="225" font-size="18" fill="#C0BAB3">#ids</text>

    <text x="735" y="58" font-size="20" font-weight="700" fill="#391214">B</text>
    <rect x="670" y="70" width="130" height="180" rx="12" fill="#52423D"/>
    <text x="735" y="170" font-size="76" font-weight="700" fill="#F3EFEA">2</text>
    <text x="735" y="225" font-size="18" fill="#C0BAB3">.clases</text>

    <text x="885" y="58" font-size="20" font-weight="700" fill="#391214">C</text>
    <rect x="820" y="70" width="130" height="180" rx="12" fill="#887D77"/>
    <text x="885" y="170" font-size="76" font-weight="700" fill="#F3EFEA">1</text>
    <text x="885" y="225" font-size="18" fill="#F3EFEA">etiquetas</text>
  </g>
</svg>
