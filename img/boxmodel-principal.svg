<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Box model: contenido, padding, border y margin</title>
  <rect x="4" y="4" width="992" height="292" rx="22" fill="#C0BAB3"/>

  <text x="50" y="88" font-size="46" font-weight="700" fill="#391214">Box model</text>
  <text x="50" y="126" font-size="21" fill="#52423D">Toda etiqueta HTML es una caja</text>

  <rect x="50" y="150" width="340" height="104" rx="10" fill="#1F1415"/>
  <g font-family="Consolas, monospace" font-size="19" fill="#C0BAB3">
    <text x="70" y="182"><tspan fill="#A49B95">padding:</tspan> 25px;</text>
    <text x="70" y="210"><tspan fill="#A49B95">border:</tspan> 5px solid;</text>
    <text x="70" y="238"><tspan fill="#A49B95">margin:</tspan> 10px;</text>
  </g>

  <!-- Capas de la caja -->
  <rect x="440" y="28" width="520" height="244" rx="8" fill="#A49B95" stroke="#52423D" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="480" y="62" width="440" height="180" rx="4" fill="#391214"/>
  <rect x="496" y="78" width="408" height="148" fill="#887D77"/>
  <rect x="560" y="112" width="280" height="80" fill="#F3EFEA"/>

  <g font-size="16" font-weight="700">
    <text x="454" y="52" fill="#391214">margin</text>
    <text x="496" y="74" font-size="13" fill="#F3EFEA">border</text>
    <text x="508" y="100" fill="#F3EFEA">padding</text>
    <text x="700" y="158" text-anchor="middle" font-size="22" fill="#391214">contenido</text>
  </g>
</svg>
