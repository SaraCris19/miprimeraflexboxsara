<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>CSS fácil: ordena cajas con flexbox</title>
  <rect x="4" y="4" width="512" height="292" rx="18" fill="#C0BAB3"/>
  <text x="260" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#391214">CSS fácil: flexbox</text>

  <rect x="30" y="54" width="460" height="64" rx="10" fill="#1F1415"/>
  <text x="48" y="80" font-family="Consolas, monospace" font-size="16" fill="#C0BAB3">.fila { <tspan fill="#A49B95">display:</tspan> flex;</text>
  <text x="104" y="104" font-family="Consolas, monospace" font-size="16" fill="#C0BAB3"><tspan fill="#A49B95">justify-content:</tspan> center; }</text>

  <!-- Sin flex: cajas apiladas -->
  <text x="125" y="136" text-anchor="middle" font-size="14" fill="#52423D">Sin flex</text>
  <rect x="45" y="142" width="160" height="128" rx="8" fill="none" stroke="#6D726D" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="58" y="154" width="70" height="30" rx="5" fill="#887D77"/>
  <rect x="58" y="192" width="70" height="30" rx="5" fill="#52423D"/>
  <rect x="58" y="230" width="70" height="30" rx="5" fill="#391214"/>

  <path d="M222 206h40m-10-10 10 10-10 10" stroke="#391214" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Con flex: en fila y centradas -->
  <text x="380" y="136" text-anchor="middle" font-size="14" fill="#52423D">Con flex</text>
  <rect x="280" y="142" width="200" height="128" rx="8" fill="none" stroke="#6D726D" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="300" y="186" width="50" height="40" rx="5" fill="#887D77"/>
  <rect x="356" y="186" width="50" height="40" rx="5" fill="#52423D"/>
  <rect x="412" y="186" width="50" height="40" rx="5" fill="#391214"/>
</svg>
